name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; a newer push waits instead of cancelling a deploy in progress.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  BASE_PATH: /flipwise/
  # Firebase *web* config is public by design (it ships in every built bundle); access is
  # enforced by Firestore rules and Auth's authorized domains. Repository variables override.
  VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || 'AIzaSyBCjK284P1c3m-vm5JRtYDrqta3A9jkKpg' }}
  VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || 'flipwise-51efa.firebaseapp.com' }}
  VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || 'flipwise-51efa' }}
  VITE_FIREBASE_STORAGE_BUCKET: ${{ vars.VITE_FIREBASE_STORAGE_BUCKET || 'flipwise-51efa.firebasestorage.app' }}
  VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ vars.VITE_FIREBASE_MESSAGING_SENDER_ID || '1026499034434' }}
  VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || '1:1026499034434:web:2459ed73a962eab14bdcdb' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Pages can only be switched on by the repository owner. Instead of failing red when it is
  # off (or set to deploy from a branch), skip the deploy and say exactly what to do.
  pages-check:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if source=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type 2>/dev/null); then
            if [ "$source" = "workflow" ]; then
              echo "enabled=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=GitHub Pages deploys from a branch::Pages is enabled with source '$source'. The repository owner should set Settings › Pages › Build and deployment › Source to 'GitHub Actions', then re-run this workflow."
              echo "enabled=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::notice title=GitHub Pages is not enabled yet::The build passed but was not deployed. The repository owner must enable Pages once: Settings › Pages › Build and deployment › Source: GitHub Actions. Then re-run this workflow (Actions › Deploy to GitHub Pages › Run workflow)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: [build, pages-check]
    if: needs.pages-check.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
